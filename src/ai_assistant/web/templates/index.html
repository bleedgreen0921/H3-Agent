<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <div class="brand-name">AI Assistant</div>
        <div class="brand-sub">本地工作台</div>
      </div>
    </div>
    <button id="new-session" type="button" class="primary new-session">＋ 新建会话</button>
    <div id="session-list" class="session-list"></div>
    <nav class="tabs" aria-label="页面">
      <button type="button" data-tab="chat" class="active">对话</button>
      <button type="button" data-tab="knowledge">知识库</button>
      <button type="button" data-tab="settings">设置</button>
      <button type="button" data-tab="storage">存储</button>
    </nav>
  </aside>

  <main id="chat-view" class="view">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="mode-switch" role="group" aria-label="对话模式">
          <button id="mode-chat" type="button" class="mode-option" aria-pressed="true"
                  title="退出规划模式，回到普通对话">对话</button>
          <button id="mode-plan" type="button" class="mode-option" aria-pressed="false"
                  title="进入规划模式；下一条消息将创建计划">规划模式</button>
        </div>
        <div id="session-title" class="session-title">未选择会话</div>
        <div class="actions">
          <button id="plan-run" type="button" class="primary" hidden>执行计划</button>
          <button id="cancel-button" type="button" class="danger" hidden>取消</button>
        </div>
      </div>
    </header>

    <section id="plan-panel" class="plan-panel hidden" aria-label="规划工作区">
      <button id="plan-toggle" type="button" class="plan-toggle" aria-expanded="false">
        <span class="plan-title">
          <span id="plan-status-dot" class="status-dot"></span>
          <span id="plan-status">规划</span>
        </span>
        <span class="plan-meta">
          <span id="plan-progress"></span>
          <span class="chevron" aria-hidden="true"></span>
        </span>
      </button>
      <div id="plan-body" class="plan-body">
        <div id="plan-goal" class="plan-goal"></div>
        <div id="plan-questions" class="plan-questions"></div>
        <ol id="plan-tasks" class="plan-tasks"></ol>
        <div id="plan-note" class="plan-note"></div>
      </div>
    </section>

    <section id="messages" class="messages" role="log" aria-label="对话消息"></section>

    <form id="composer" class="composer">
      <div class="composer-inner">
        <div id="composer-hint" class="composer-hint hidden"></div>
        <div id="attachment-chips" class="chips"></div>
        <textarea id="input" rows="2" placeholder="输入消息；Enter 发送，Shift+Enter 换行"></textarea>
        <div class="composer-row">
          <div class="composer-left">
            <label class="upload">附件
              <input id="file-input" type="file" multiple accept=".bash,.bat,.c,.cc,.cfg,.cjs,.cmd,.conf,.cpp,.cs,.css,.csv,.cxx,.dart,.docx,.fish,.go,.groovy,.h,.hh,.hpp,.htm,.html,.ini,.java,.js,.json,.jsonl,.jsx,.kt,.kts,.less,.log,.lua,.markdown,.md,.mjs,.ndjson,.pdf,.php,.pl,.ps1,.py,.pyi,.r,.rb,.rs,.rst,.sass,.scala,.scss,.sh,.sql,.svelte,.swift,.toml,.ts,.tsv,.tsx,.txt,.vue,.xml,.yaml,.yml,.zsh">
            </label>
            <span id="composer-mode" class="composer-mode">普通对话</span>
          </div>
          <button id="send-button" type="submit" class="primary send-button">发送</button>
        </div>
      </div>
    </form>
  </main>

  <main id="knowledge-view" class="view hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="page-title">知识库</div>
        <button id="sync-knowledge" type="button">同步来源</button>
      </div>
    </header>
    <section class="panel scroll-panel">
      <div class="panel-head">
        <h2>来源</h2>
        <span id="knowledge-status" class="muted"></span>
      </div>
      <div id="knowledge-sources" class="cards"></div>
      <div class="panel-head">
        <h2>文档</h2>
        <span id="knowledge-document-count" class="muted"></span>
      </div>
      <div id="knowledge-documents" class="table-wrap"></div>
      <p class="muted knowledge-hint">知识来源由配置维护；修改来源配置后点击“同步来源”。</p>
    </section>
  </main>

  <main id="settings-view" class="view hidden">
    <header class="topbar">
      <div class="topbar-inner"><div class="page-title">设置</div></div>
    </header>
    <section class="panel scroll-panel">
      <div id="settings" class="settings-list"></div>
    </section>
  </main>

  <main id="storage-view" class="view hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="page-title">存储检查</div>
        <button id="storage-refresh" type="button">刷新</button>
      </div>
    </header>
    <section class="panel scroll-panel">
      <div class="storage-warning">
        只读调试视图：包含会话正文、工具结果和操作回执，仅供本机查看。
      </div>
      <div id="storage-health" class="storage-health"></div>
      <div id="storage-summary" class="storage-summary"></div>
      <div class="panel-head"><h2>轮次</h2></div>
      <div id="storage-turns"></div>
      <div class="panel-head">
        <h2>Checkpoint</h2>
        <select id="storage-thread" class="storage-thread"></select>
      </div>
      <div id="storage-checkpoints"></div>
      <button id="storage-more" type="button" class="hidden">加载更多 checkpoint</button>
      <div id="storage-detail"></div>
      <div class="panel-head"><h2>Web 消息</h2></div>
      <div id="storage-messages"></div>
      <div class="panel-head"><h2>操作回执</h2></div>
      <div id="storage-operations"></div>
      <div class="panel-head"><h2>模型用量</h2></div>
      <div id="storage-usage"></div>
    </section>
  </main>
</div>
<div id="toast" class="toast hidden" role="alert"></div>
<script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>
