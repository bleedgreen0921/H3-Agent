# 复制为 assistant.toml；相对路径以配置所在目录为基准。
default_model = "deepseek"
[models.deepseek]
provider = "deepseek"
model = "deepseek-flash"
api_key = "REPLACE_API_KEY"
max_input_tokens = 1048576  # DeepSeek 官方 1M 上下文；应用另保留 10% 余量
[models.deepseek.parameters]
use_responses_api = true
reasoning = { effort = "none" }
timeout = 60
max_retries = 0

[sessions]
database_url = "postgresql://user@127.0.0.1:55432/H3-Agent"
[context]
summary_every_turns = 10
summary_tokens = 10000
tool_result_tokens = 4000
mcp_schema_tokens = 6000
[workspace]
root = "."
[tools.files]
enabled = false

# 本地 Skills 由用户手动放入 .agents/skills 或显式目录。
# [skills]
# roots = []
# disabled = [] # 按名称或完整 ID 排除自动发现的 Skill，不删除共享文件。
# [tools.terminal]
# timeout = 120
# allow_network = false
# read_paths = [] # 显式额外只读目录；不会默认读取用户账号目录。
# [tools.terminal.env]
# SERVICE_API_KEY = "REPLACE_KEY" # 只传递明确授权给命令的凭据。
# [tools.web]
# credential_profile = "deepseek"

