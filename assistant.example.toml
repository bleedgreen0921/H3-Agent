# 复制为 assistant.toml；相对路径以配置所在目录为基准。
default_model = "deepseek"
[models.deepseek]
provider = "deepseek"
model = "REPLACE_MODEL_ID"
api_key = "REPLACE_API_KEY"
max_input_tokens = 24000
[models.deepseek.parameters]
timeout = 60
max_retries = 0
[models.deepseek.parameters.extra_body.thinking]
type = "disabled"

[sessions]
database_url = "postgresql://user@127.0.0.1:55432/H3-Agent"
[context]
[workspace]
root = "."
[tools.files]
enabled = false

# 本地 Skills 由用户手动放入 .agents/skills 或显式目录。
# [skills]
# roots = []
# [tools.terminal]
# timeout = 120
# allow_network = false
# read_paths = [] # 显式额外只读目录；不会默认读取用户账号目录。
# [tools.terminal.env]
# SERVICE_API_KEY = "REPLACE_KEY" # 只传递明确授权给命令的凭据。
# [tools.web]
# credential_profile = "deepseek"

