# 飞书专项示例；基础配置与使用说明见 assistant.example.toml / README.md。
# 复制到私有配置后替换占位值，勿覆盖已有真实配置。
default_model = "deepseek"
[models.deepseek]
provider = "deepseek"
model = "deepseek-flash"
api_key = "REPLACE_DEEPSEEK_API_KEY"
max_input_tokens = 1048576  # DeepSeek 官方 1M 上下文；应用另保留 10% 余量
[models.deepseek.parameters]
timeout = 60
max_retries = 0
[models.deepseek.parameters.extra_body.thinking]
type = "disabled"
[workspace]
root = "."
[sessions]
database_url = "postgresql://user@127.0.0.1:55432/H3-Agent"
[mcp]
connect_timeout = 15
call_timeout = 30
# Must be outside workspace; ~ is expanded only for this explicit state path.
state_dir = "~/.local/state/ai-assistant"
[integrations.feishu]
default_task_assignee = "none" # 主人私聊可显式改为 owner
app_id = "cli_REPLACE"
app_secret = "REPLACE_APP_SECRET"
owner_open_id = "REPLACE_OWNER_OPEN_ID"
redirect_uri = "http://127.0.0.1:3000/callback"
scopes = ["offline_access", "im:message", "im:message:readonly", "im:chat:readonly", "docx:document", "drive:drive", "wiki:wiki", "bitable:app", "calendar:calendar", "task:task", "contact:user.base:readonly"]
node_project = "deploy/feishu"
[mcp.servers.feishu_user]
transport = "feishu"
identity = "user"
tools = ["docx_v1_document_get", "docx_v1_document_rawContent", "docx_v1_document_create", "calendar_v4_calendar_list", "calendar_v4_calendarEvent_list", "calendar_v4_calendarEvent_create", "calendar_v4_calendarEvent_patch", "calendar_v4_calendarEvent_delete", "task_v2_task_get", "task_v2_task_list", "task_v2_task_create", "task_v2_task_patch", "task_v2_task_addMembers", "wiki_v2_space_getNode"]
write_tools = ["docx_v1_document_create", "calendar_v4_calendarEvent_create", "calendar_v4_calendarEvent_patch", "calendar_v4_calendarEvent_delete", "task_v2_task_create", "task_v2_task_patch", "task_v2_task_addMembers"]
allow_write = true
[mcp.servers.feishu_bot]
transport = "feishu"
identity = "bot"
tools = ["im_v1_message_list", "im_v1_message_create", "docx_v1_document_get", "docx_v1_document_create", "wiki_v2_space_list", "wiki_v2_spaceNode_create", "bitable_v1_appTableRecord_list", "bitable_v1_appTableRecord_create", "drive_v1_file_list", "drive_v1_file_createFolder", "contact_v3_user_get", "wiki_v2_space_getNode", "docx_v1_document_rawContent"]
write_tools = ["im_v1_message_create", "docx_v1_document_create", "wiki_v2_spaceNode_create", "bitable_v1_appTableRecord_create", "drive_v1_file_createFolder"]
allow_write = true
[mcp.servers.feishu_bot.resource_arguments]
im_v1_message_create = ["data.receive_id"]
im_v1_message_list = ["params.container_id"]
[mcp.servers.feishu_files]
transport = "feishu_files"
identity = "bot"
tools = ["upload_drive", "download_drive", "upload_message_file", "download_message_file"]
write_tools = ["upload_drive", "upload_message_file"]
allow_write = true
[channels.feishu]
enabled = false
streaming = false
stream_interval_seconds = 1
card_max_bytes = 24576
# Explicitly enable only your test group after applying the schema and OAuth login.
# [channels.feishu.groups.oc_REPLACE.resources]
# feishu_bot = ["oc_REPLACE"]

[context]
summary_tokens = 1500
tool_result_tokens = 4000
mcp_schema_tokens = 6000

# 办公入口也可启用长期知识库。先填写数据库并显式执行 rag init。
# [knowledge]
# database_url = "postgresql+asyncpg://USER:password@127.0.0.1:5432/assistant"
# knowledge_base_id = "default"
# [knowledge.sources.team_wiki]
# kind = "feishu_wiki"
# token = "SPACE_ID"
# identity = "user"
# Embedding/Reranker 默认使用本机 llama.cpp 1236/1235 端口。

# 个人风格文件路径相对本配置文件；删除此项即可使用默认风格。
[agent]
model_call_limit = 20
tool_call_limit = 40
summary_call_limit = 10
turn_timeout_seconds = 300
timezone = "Asia/Shanghai"
persona_file = "PERSONA.md"

# 先配置 sessions、context、knowledge 本地向量和飞书主人，再显式 memory init。
[memory]
enabled = false
